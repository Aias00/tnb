name: Verify runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TNB_REQUIRE_NATIVE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: command -v rg || brew install ripgrep
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  native-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TNB_REQUIRE_NATIVE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap curl ripgrep util-linux
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - if: runner.os == 'Linux'
        run: bun test
      - if: runner.os == 'Windows'
        run: bun test tests/unit/sandbox-runtime.test.ts tests/unit/usage-budget.test.ts tests/unit/execution-binding.test.ts tests/unit/mcp-manager.test.ts tests/integration/sandbox-native.test.ts tests/integration/durable-capabilities.test.ts tests/integration/plugin-policy.test.ts tests/integration/plugin-runtime.test.ts tests/integration/plugin-tool-input.test.ts tests/unit/plugin-services.test.ts tests/integration/plugin-services.test.ts tests/unit/plugin-data.test.ts tests/integration/plugin-data.test.ts tests/integration/plugin-backup.test.ts tests/unit/durable-runtime-maintenance.test.ts tests/unit/collaboration-store.test.ts tests/unit/collaboration-service.test.ts tests/unit/web-workbench.test.ts tests/integration/web-workbench.test.ts tests/integration/web-chat.test.ts tests/integration/sdk-query-lifecycle.test.ts tests/unit/agent-domain.test.ts tests/integration/agent-plugins.test.ts tests/integration/builtin-generations.test.ts tests/integration/channel-generations.test.ts tests/unit/collaboration-channels.test.ts
      - run: bun run build
